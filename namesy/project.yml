# XcodeGen spec — run `xcodegen generate` in this directory on a Mac,
# then open Namesy.xcodeproj.
name: Namesy
options:
  bundleIdPrefix: io.starnova
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NamesyCore:
    path: NamesyCore

targets:
  Namesy:
    type: application
    platform: iOS
    sources:
      - NamesyApp/Sources
    dependencies:
      - package: NamesyCore
        product: RenameEngine
      - package: NamesyCore
        product: FileOps
    info:
      path: NamesyApp/Info.plist
      properties:
        CFBundleDisplayName: Namesy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSPhotoLibraryAddUsageDescription: >-
          Namesy never modifies your photo library; this permission is not requested.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.starnova.namesy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false

  NamesyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NamesyUITests
    dependencies:
      - target: Namesy
    settings:
      base:
        TEST_TARGET_NAME: Namesy
        SWIFT_VERSION: "6.0"

schemes:
  Namesy:
    build:
      targets:
        Namesy: all
        NamesyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NamesyUITests
