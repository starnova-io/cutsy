name: Namesy core tests

on:
  push:
    paths:
      - "namesy/NamesyCore/**"
      - ".github/workflows/namesy-core-tests.yml"
  pull_request:
    paths:
      - "namesy/NamesyCore/**"
      - ".github/workflows/namesy-core-tests.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run NamesyCore tests
        working-directory: namesy/NamesyCore
        run: swift test
