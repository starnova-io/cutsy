<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  html,body{margin:0;padding:0;width:2732px;height:2732px;overflow:hidden}
  /* The launch screen is not the app icon blown up — pasting the icon in
     leaves a hard square (or a rounded one, which is worse) sitting on the
     cream. The island is drawn straight onto the background instead, so
     there is no edge at all, and the wordmark tells you where you are. */
  .bg{width:2732px;height:2732px;background:#33273A;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:90px}
  h1{margin:0;font:600 150px/1 "Fraunces",Georgia,serif;color:#F2EAEE;letter-spacing:.01em}
</style></head><body>
<div class="bg">
  <svg width="1180" height="1180" viewBox="0 0 100 100">
    <!-- ✦ energy -->
    <path d="M76 12c1.3 6.6 2.7 8 9.3 9.3-6.6 1.3-8 2.7-9.3 9.3-1.3-6.6-2.7-8-9.3-9.3 6.6-1.3 8-2.7 9.3-9.3z" fill="#DFA23A"/>
    <!-- rock underside: two faces so it reads as solid, not a flat disc -->
    <path d="M18 59c3.5 16 11.5 27 32 33 20.5-6 28.5-17 32-33z" fill="#8A6247"/>
    <path d="M50 92c20.5-6 28.5-17 32-33H50z" fill="#6E4A34"/>
    <!-- grass: side band + lit top -->
    <ellipse cx="50" cy="59" rx="32" ry="14" fill="#7FA26A"/>
    <ellipse cx="50" cy="56" rx="32" ry="14" fill="#93B87C"/>
    <!-- cabin, one window burning warm -->
    <ellipse cx="50" cy="55.5" rx="16" ry="4.6" fill="#FFDF9E" opacity=".42"/>
    <path d="M42 55.5h14V45H42z" fill="#CFC3C8"/>
    <path d="M56 55.5h4.5V45H56z" fill="#B4A7AD"/>
    <path d="M39.5 45.5 49 37l12.5 8.5z" fill="#47663E"/>
    <path d="M49 37l12.5 8.5H56z" fill="#3A5533"/>
    <rect x="45.5" y="47.5" width="6" height="5" rx="1.2" fill="#FFDF9E"/>
    <!-- two conifers, so the isle is a place and not just a hill -->
    <path d="M73 55l-4.4-10L64.2 55z" fill="#5A7D4A"/>
    <path d="M72.1 49.2l-3.5-7.8-3.5 7.8z" fill="#6F945C"/>
    <path d="M35 56l-3.6-8L27.8 56z" fill="#5A7D4A"/>
  </svg>
  <h1>Hearth Island</h1>
</div></body></html>
