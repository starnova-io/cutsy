<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;overflow:hidden}
  /* Deep sea ground: the island reads as a warm shape on cool water even at 40px. */
  .bg{width:1024px;height:1024px;position:relative;
      background:linear-gradient(160deg,#7FA9AE 0%,#5B808B 46%,#3F5F6B 100%)}
</style></head><body>
<div class="bg">
  <!--
    A single floating isle: grass dome + rock underside + one lit cabin, with the
    game's ✦ (energy) above it. No horizon line, no text — the silhouette alone
    has to survive the home-screen grid.
  -->
  <svg width="1024" height="1024" viewBox="0 0 100 100">
    <!-- water ripple rings under the isle -->
    <ellipse cx="50" cy="90" rx="34" ry="6.5" fill="#ffffff" opacity=".10"/>
    <ellipse cx="50" cy="90" rx="21" ry="4" fill="#ffffff" opacity=".10"/>

    <!-- rock underside: two faces so it reads as solid, not a flat disc -->
    <path d="M18 59c3.5 16 11.5 27 32 33 20.5-6 28.5-17 32-33z" fill="#8A6247"/>
    <path d="M50 92c20.5-6 28.5-17 32-33H50z" fill="#6E4A34"/>

    <!-- grass: side band + lit top -->
    <ellipse cx="50" cy="59" rx="32" ry="14" fill="#7FA26A"/>
    <ellipse cx="50" cy="56" rx="32" ry="14" fill="#93B87C"/>

    <!-- cabin: cream walls, deep-green roof, one window burning warm -->
    <ellipse cx="50" cy="55.5" rx="14" ry="4" fill="#FFDF9E" opacity=".28"/>
    <path d="M42 55.5h14V45H42z" fill="#F2ECEB"/>
    <path d="M56 55.5h4.5V45H56z" fill="#DCD3D1"/>
    <path d="M39.5 45.5 49 37l12.5 8.5z" fill="#47663E"/>
    <path d="M49 37l12.5 8.5H56z" fill="#3A5533"/>
    <rect x="45.5" y="47.5" width="6" height="5" rx="1.2" fill="#FFDF9E"/>

    <!-- two conifers, so the isle is a place and not just a hill -->
    <path d="M73 55l-4.4-10L64.2 55z" fill="#5A7D4A"/>
    <path d="M72.1 49.2l-3.5-7.8-3.5 7.8z" fill="#6F945C"/>
    <path d="M35 56l-3.6-8L27.8 56z" fill="#5A7D4A"/>

    <!-- ✦ energy, the thing the whole app is about -->
    <path d="M76 12c1.3 6.6 2.7 8 9.3 9.3-6.6 1.3-8 2.7-9.3 9.3-1.3-6.6-2.7-8-9.3-9.3 6.6-1.3 8-2.7 9.3-9.3z" fill="#DFA23A"/>
  </svg>
</div></body></html>
