# XcodeGen spec — run `xcodegen generate` in this directory on a Mac,
# then open Onym.xcodeproj.
name: Onym
options:
  bundleIdPrefix: io.starnova
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  OnymCore:
    path: OnymCore

targets:
  Onym:
    type: application
    platform: iOS
    sources:
      - OnymApp/Sources
    dependencies:
      - package: OnymCore
        product: RenameEngine
      - package: OnymCore
        product: FileOps
    info:
      path: OnymApp/Info.plist
      properties:
        CFBundleDisplayName: Onym
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSPhotoLibraryAddUsageDescription: >-
          Onym never modifies your photo library; this permission is not requested.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.starnova.onym
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false

  OnymUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OnymUITests
    dependencies:
      - target: Onym
    settings:
      base:
        TEST_TARGET_NAME: Onym
        SWIFT_VERSION: "6.0"

schemes:
  Onym:
    build:
      targets:
        Onym: all
        OnymUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OnymUITests
